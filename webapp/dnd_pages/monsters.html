<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monster Roster — DnDPython</title>
  <style>
    :root { --ink: #1c1a17; --parchment: #e8e0d0; --gold: #e8e0d0; --gold-dim: #b0a48f; --crimson: #7a3030; --steel-dark: #1c1a17; --glow-hot: rgba(0,0,0,0); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--steel-dark); color: var(--parchment); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.6; min-height: 100vh; }
    .page { max-width: 980px; margin: 0 auto; padding: 2rem; position: relative; z-index: 1; }
    .page-header { display: flex; align-items: center; gap: 2rem; padding: 2rem 0 1.5rem; border-bottom: 1px solid #4a3728; margin-bottom: 2.5rem; }
    .back-link { font-size: 0.75rem; letter-spacing: 0.05em; color: var(--gold-dim); text-decoration: none; white-space: nowrap; flex-shrink: 0; }
    .back-link:hover { color: var(--gold); }
    .page-title { font-size: clamp(1.3rem, 4vw, 1.8rem); color: var(--gold); }
    .page-subtitle { font-size: 0.8rem; letter-spacing: 0.05em; color: var(--gold-dim); margin-top: 0.3rem; }

    .monster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 2rem; }
    @media (max-width: 500px) { .monster-grid { grid-template-columns: 1fr; } }

    /* D&D-style stat block, restyled to match the map generator's dark panels */
    .stat-block { background: #241f1a; color: #e8e0d0; border: 1px solid #4a3728; border-radius: 6px; overflow: hidden; }
    .sb-header { background: var(--crimson); padding: 0.8rem 1rem 0.7rem; }
    .sb-name { font-size: 1.1rem; font-weight: 600; color: #e8e0d0; }
    .sb-type { font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; color: rgba(232,224,208,0.65); margin-top: 0.15rem; }
    .sb-body { padding: 0.9rem 1rem; }
    .sb-row { font-size: 0.95rem; margin-bottom: 0.2rem; }
    .sb-row b { font-size: 0.68rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--gold-dim); }
    .sb-divider { height: 1px; background: #4a3728; margin: 0.65rem 0; }
    .sb-stats { display: flex; text-align: center; border-top: 1px solid #4a3728; border-bottom: 1px solid #4a3728; padding: 0.5rem 0; margin: 0.65rem 0; }
    .sb-stat { flex: 1; }
    .sb-stat-lbl { font-size: 0.6rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--gold-dim); display: block; }
    .sb-stat-val { font-size: 0.88rem; font-weight: 600; display: block; }
    .sb-attack-head { font-size: 0.68rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--gold-dim); display: block; border-top: 1px solid #4a3728; padding-top: 0.5rem; margin-bottom: 0.4rem; }
    .sb-attack { font-size: 0.88rem; margin-bottom: 0.35rem; }
    .sb-attack i { font-style: italic; }
    .loading { text-align: center; color: rgba(232,224,208,0.4); font-style: italic; padding: 4rem 0; grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <nav style="display:flex;gap:1.1rem;flex-wrap:wrap;align-items:center;">
        <a class="back-link" href="/dnd">← Home</a>
        <a class="back-link" href="/dnd/builder">Builder</a>
        <a class="back-link" href="/dnd/scenario-builder">Scenario Builder</a>
        <a class="back-link" href="/dnd/simulator">Simulator</a>
        <a class="back-link" href="/dnd/analyzer">Position Analyzer</a>
        <a class="back-link" href="/dnd/dummy">Dummy Tester</a>
        <a class="back-link" href="/dnd/scenarios">Scenarios</a>
        <a class="back-link" href="/dnd/monsters">Monsters</a>
        <a class="back-link" href="/dnd/classes">Classes</a>
        <a class="back-link" href="/app" style="margin-left:1.5rem;">Map Generator →</a>
      </nav>
      <div>
        <h1 class="page-title">🐉 Monster Roster</h1>
        <p class="page-subtitle">Stat Blocks &amp; Attack Profiles</p>
      </div>
    </header>
    <div id="grid" class="monster-grid">
      <p class="loading">Loading monsters…</p>
    </div>
  </div>

  <script>
    const API_URL = "/api/dnd";

    function mod(s) { const m = Math.floor((s - 10) / 2); return (m >= 0 ? "+" : "") + m; }

    function renderMonster(m) {
      const stats = m.stats || {};
      const keys  = ["Str","Dex","Con","Int","Wis","Cha"];
      const statsHtml = keys.map(k => `
        <div class="sb-stat">
          <span class="sb-stat-lbl">${k}</span>
          <span class="sb-stat-val">${stats[k] ?? "—"}<br><small>(${mod(stats[k] ?? 10)})</small></span>
        </div>`).join("");

      const attacksHtml = (m.attacks || []).map(a => {
        const typeLabel = a.attack_type === "melee" ? "Melee Weapon Attack" : "Ranged Weapon Attack";
        const hitStr    = (a.attack_bonus >= 0 ? "+" : "") + a.attack_bonus + " to hit";
        const rangeStr  = `range ${a.normal_range}/${a.long_range} ft.`;
        const dmgSign   = a.damage_mod >= 0 ? "+" : "";
        const dmgStr    = `1d${a.damage_die} ${dmgSign}${a.damage_mod}`;
        return `<div class="sb-attack"><b>${a.name}.</b> ${typeLabel}: ${hitStr}, ${rangeStr} <i>Hit:</i> ${dmgStr} damage.</div>`;
      }).join("");

      return `
        <div class="stat-block">
          <div class="sb-header">
            <div class="sb-name">${m.name}</div>
            <div class="sb-type">Medium Humanoid</div>
          </div>
          <div class="sb-body">
            <div class="sb-row"><b>Armor Class</b> ${m.ac}</div>
            <div class="sb-row"><b>Hit Points</b> ${m.hp}</div>
            <div class="sb-row"><b>Proficiency Bonus</b> +${m.proficiency}</div>
            <div class="sb-stats">${statsHtml}</div>
            ${attacksHtml.length ? `<span class="sb-attack-head">Actions</span>${attacksHtml}` : ""}
          </div>
        </div>`;
    }

    async function load() {
      const grid = document.getElementById("grid");
      try {
        const names    = (await (await fetch(`${API_URL}/monsters`)).json()).monsters;
        const monsters = await Promise.all(names.map(n => fetch(`${API_URL}/monsters/${n}`).then(r => r.json())));
        grid.innerHTML = monsters.map(renderMonster).join("");
      } catch(e) {
        grid.innerHTML = `<p class="loading">Could not reach API: ${e.message}</p>`;
      }
    }
    document.addEventListener("DOMContentLoaded", load);
  </script>
</body>
</html>
