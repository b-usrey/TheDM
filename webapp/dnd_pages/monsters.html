<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monster Roster — DnDPython</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #0d0b0e; --parchment: #f2e8d5; --gold: #c9a84c; --gold-dim: #7a5f28; --crimson: #8b1a1a; --steel-dark: #111820; --glow-hot: rgba(201,168,76,0.45); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--steel-dark); color: var(--parchment); font-family: 'Crimson Pro', Georgia, serif; font-size: 18px; line-height: 1.7; min-height: 100vh; }
    body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); background-size: 200px; pointer-events: none; z-index: 0; opacity: 0.5; }
    .page { max-width: 980px; margin: 0 auto; padding: 2rem; position: relative; z-index: 1; }
    .page-header { display: flex; align-items: center; gap: 2rem; padding: 2rem 0 1.5rem; border-bottom: 1px solid rgba(201,168,76,0.2); margin-bottom: 2.5rem; }
    .back-link { font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold-dim); text-decoration: none; white-space: nowrap; flex-shrink: 0; }
    .back-link:hover { color: var(--gold); }
    .page-title { font-family: 'Cinzel Decorative', serif; font-size: clamp(1.4rem, 4vw, 2.2rem); color: var(--gold); text-shadow: 0 0 30px var(--glow-hot); }
    .page-subtitle { font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-dim); margin-top: 0.3rem; }

    .monster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 2rem; }
    @media (max-width: 500px) { .monster-grid { grid-template-columns: 1fr; } }

    /* D&D-style stat block */
    .stat-block { background: #fdf1dc; color: #1a0a00; border: 1px solid #9c6f25; box-shadow: 0 6px 24px rgba(0,0,0,0.6); }
    .sb-header { background: var(--crimson); padding: 0.8rem 1rem 0.7rem; }
    .sb-name { font-family: 'Cinzel Decorative', serif; font-size: 1.15rem; color: #f2e8d5; }
    .sb-type { font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(242,232,213,0.65); margin-top: 0.15rem; }
    .sb-body { padding: 0.9rem 1rem; }
    .sb-row { font-size: 0.95rem; margin-bottom: 0.2rem; }
    .sb-row b { font-family: 'Cinzel', serif; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--crimson); }
    .sb-divider { height: 1px; background: rgba(156,111,37,0.5); margin: 0.65rem 0; }
    .sb-stats { display: flex; text-align: center; border-top: 1px solid rgba(156,111,37,0.4); border-bottom: 1px solid rgba(156,111,37,0.4); padding: 0.5rem 0; margin: 0.65rem 0; }
    .sb-stat { flex: 1; }
    .sb-stat-lbl { font-family: 'Cinzel', serif; font-size: 0.6rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--crimson); display: block; }
    .sb-stat-val { font-size: 0.88rem; font-weight: 600; display: block; }
    .sb-attack-head { font-family: 'Cinzel', serif; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--crimson); display: block; border-top: 1px solid rgba(156,111,37,0.4); padding-top: 0.5rem; margin-bottom: 0.4rem; }
    .sb-attack { font-size: 0.88rem; margin-bottom: 0.35rem; }
    .sb-attack i { font-style: italic; }
    .loading { text-align: center; color: rgba(242,232,213,0.4); font-style: italic; padding: 4rem 0; grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <nav style="display:flex;gap:1.1rem;flex-wrap:wrap;align-items:center;">
        <a class="back-link" href="/dnd">← Home</a>
        <a class="back-link" href="/dnd/builder">Builder</a>
        <a class="back-link" href="/dnd/simulator">Simulator</a>
        <a class="back-link" href="/dnd/scenarios">Scenarios</a>
        <a class="back-link" href="/dnd/monsters">Monsters</a>
        <a class="back-link" href="/dnd/classes">Classes</a>
        <a class="back-link" href="/" style="margin-left:1.5rem;">Map Generator →</a>
      </nav>
      <div>
        <h1 class="page-title">🐉 Monster Roster</h1>
        <p class="page-subtitle">Stat Blocks &amp; Attack Profiles</p>
      </div>
    </header>
    <div id="grid" class="monster-grid">
      <p class="loading">Loading monsters…</p>
    </div>
  </div>

  <script>
    const API_URL = "/api/dnd";

    function mod(s) { const m = Math.floor((s - 10) / 2); return (m >= 0 ? "+" : "") + m; }

    function renderMonster(m) {
      const stats = m.stats || {};
      const keys  = ["Str","Dex","Con","Int","Wis","Cha"];
      const statsHtml = keys.map(k => `
        <div class="sb-stat">
          <span class="sb-stat-lbl">${k}</span>
          <span class="sb-stat-val">${stats[k] ?? "—"}<br><small>(${mod(stats[k] ?? 10)})</small></span>
        </div>`).join("");

      const attacksHtml = (m.attacks || []).map(a => {
        const typeLabel = a.attack_type === "melee" ? "Melee Weapon Attack" : "Ranged Weapon Attack";
        const hitStr    = (a.attack_bonus >= 0 ? "+" : "") + a.attack_bonus + " to hit";
        const rangeStr  = `range ${a.normal_range}/${a.long_range} ft.`;
        const dmgSign   = a.damage_mod >= 0 ? "+" : "";
        const dmgStr    = `1d${a.damage_die} ${dmgSign}${a.damage_mod}`;
        return `<div class="sb-attack"><b>${a.name}.</b> ${typeLabel}: ${hitStr}, ${rangeStr} <i>Hit:</i> ${dmgStr} damage.</div>`;
      }).join("");

      return `
        <div class="stat-block">
          <div class="sb-header">
            <div class="sb-name">${m.name}</div>
            <div class="sb-type">Medium Humanoid</div>
          </div>
          <div class="sb-body">
            <div class="sb-row"><b>Armor Class</b> ${m.ac}</div>
            <div class="sb-row"><b>Hit Points</b> ${m.hp}</div>
            <div class="sb-row"><b>Proficiency Bonus</b> +${m.proficiency}</div>
            <div class="sb-stats">${statsHtml}</div>
            ${attacksHtml.length ? `<span class="sb-attack-head">Actions</span>${attacksHtml}` : ""}
          </div>
        </div>`;
    }

    async function load() {
      const grid = document.getElementById("grid");
      try {
        const names    = (await (await fetch(`${API_URL}/monsters`)).json()).monsters;
        const monsters = await Promise.all(names.map(n => fetch(`${API_URL}/monsters/${n}`).then(r => r.json())));
        grid.innerHTML = monsters.map(renderMonster).join("");
      } catch(e) {
        grid.innerHTML = `<p class="loading">Could not reach API: ${e.message}</p>`;
      }
    }
    document.addEventListener("DOMContentLoaded", load);
  </script>
</body>
</html>
