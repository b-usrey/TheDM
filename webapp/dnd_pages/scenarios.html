<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scenarios — DnDPython</title>
  <style>
    :root { --ink: #1c1a17; --parchment: #e8e0d0; --gold: #e8e0d0; --gold-dim: #b0a48f; --steel-dark: #1c1a17; --steel-mid: #241f1a; --glow: rgba(0,0,0,0); --glow-hot: rgba(0,0,0,0); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--steel-dark); color: var(--parchment); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.6; min-height: 100vh; }
    .page { max-width: 860px; margin: 0 auto; padding: 2rem; position: relative; z-index: 1; }
    .page-header { display: flex; align-items: center; gap: 2rem; padding: 2rem 0 1.5rem; border-bottom: 1px solid #4a3728; margin-bottom: 2.5rem; }
    .back-link { font-size: 0.75rem; letter-spacing: 0.05em; color: var(--gold-dim); text-decoration: none; white-space: nowrap; flex-shrink: 0; }
    .back-link:hover { color: var(--gold); }
    .page-title { font-size: clamp(1.3rem, 4vw, 1.8rem); color: var(--gold); }
    .page-subtitle { font-size: 0.8rem; letter-spacing: 0.05em; color: var(--gold-dim); margin-top: 0.3rem; }

    .scenario-list { display: flex; flex-direction: column; gap: 1.5rem; }

    .scenario-card { background: #241f1a; border: 1px solid #4a3728; border-left: 3px solid var(--gold-dim); padding: 1.5rem; }

    .sc-title { font-size: 1.1rem; font-weight: 600; color: var(--gold); margin-bottom: 0.75rem; }

    .sc-meta { display: flex; gap: 2rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .sc-tag { font-size: 0.68rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--gold-dim); }
    .sc-tag span { color: var(--parchment); font-size: 0.9rem; letter-spacing: 0; text-transform: none; }

    .sc-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; font-size: 0.9rem; }
    .sc-party-label { font-size: 0.68rem; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 0.3rem; }
    .blue { color: #6ab0e8; } .red { color: #e87070; }
    .sc-party-entry { color: rgba(232,224,208,0.8); }

    .sc-btn { display: inline-block; font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.6rem 1.5rem; border-radius: 4px; border: 1px solid #4a3728; background: #3a3228; color: var(--parchment); text-decoration: none; transition: background .2s; }
    .sc-btn:hover { background: #4a3f30; }

    .loading { text-align: center; color: rgba(232,224,208,0.4); font-style: italic; padding: 4rem 0; }
  </style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <nav style="display:flex;gap:1.1rem;flex-wrap:wrap;align-items:center;">
        <a class="back-link" href="/dnd">← Home</a>
        <a class="back-link" href="/dnd/builder">Builder</a>
        <a class="back-link" href="/dnd/simulator">Simulator</a>
        <a class="back-link" href="/dnd/scenarios">Scenarios</a>
        <a class="back-link" href="/dnd/monsters">Monsters</a>
        <a class="back-link" href="/dnd/classes">Classes</a>
        <a class="back-link" href="/app" style="margin-left:1.5rem;">Map Generator →</a>
      </nav>
      <div>
        <h1 class="page-title">📜 Scenarios</h1>
        <p class="page-subtitle">Available Encounters</p>
      </div>
    </header>

    <div id="scenario-list" class="scenario-list">
      <p class="loading">Loading scenarios…</p>
    </div>
  </div>

  <script>
    const API_URL = "/api/dnd";

    function formatName(filename) {
      return filename.replace(".json", "").replace(/_/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function renderScenario(filename, data) {
      const players = (data.players || []).map(p => {
        const cls = (p.classes || []).map(([c, l]) => `${c} ${l}`).join(", ");
        return `<div class="sc-party-entry">${p.name} — ${cls}</div>`;
      }).join("");

      const monsters = (data.monsters || []).map(m =>
        `<div class="sc-party-entry">${m.count}× ${m.type.charAt(0) + m.type.slice(1).toLowerCase()} (${m.weapon_role || "random"})</div>`
      ).join("");

      const mapW = data.map?.width ?? "?";
      const mapH = data.map?.height ?? "?";
      const maxRounds = data.max_rounds ?? 100;

      return `
        <div class="scenario-card">
          <div class="sc-title">${formatName(filename)}</div>
          <div class="sc-meta">
            <div class="sc-tag">Map <span>${mapW} × ${mapH} tiles</span></div>
            <div class="sc-tag">Max Rounds <span>${maxRounds}</span></div>
          </div>
          <div class="sc-parties">
            <div>
              <div class="sc-party-label blue">Blue Team</div>
              ${players || '<div class="sc-party-entry">—</div>'}
            </div>
            <div>
              <div class="sc-party-label red">Red Team</div>
              ${monsters || '<div class="sc-party-entry">—</div>'}
            </div>
          </div>
          <a class="sc-btn" href="simulator.html?scenario=${encodeURIComponent(filename)}">Run in Simulator →</a>
        </div>
      `;
    }

    async function loadScenarios() {
      const list = document.getElementById("scenario-list");
      try {
        const listRes  = await fetch(`${API_URL}/scenarios`);
        const listData = await listRes.json();
        const scenarios = await Promise.all(
          listData.scenarios.map(name =>
            fetch(`${API_URL}/scenarios/${name}`).then(r => r.json()).then(d => [name, d])
          )
        );
        list.innerHTML = scenarios.map(([name, data]) => renderScenario(name, data)).join("");
      } catch (e) {
        list.innerHTML = `<p class="loading">Could not reach API: ${e.message}</p>`;
      }
    }

    document.addEventListener("DOMContentLoaded", loadScenarios);
  </script>
</body>
</html>
